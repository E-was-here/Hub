services:
  scouts-hub:
    image: ghcr.io/e-was-here/hub:1.0.0
    container_name: scouts-hub
    working_dir: /app
    command: node server.js
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    environment:
      PORT: ${PORT}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    networks:
      - proxy-net

networks:
  proxy-net:
    external: true
