<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Games</title>
<style>
  :root { --bg:#0f1720; --panel:#182430; --txt:#e8eef4; --muted:#8aa0b3; --up:#2ecc71; --down:#e74c3c; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--txt); font-family:system-ui,sans-serif; min-height:100vh; padding:24px 16px; }
  .wrap { max-width:720px; margin:0 auto; }
  h1 { font-size:1.6rem; margin-bottom:6px; }
  .sub { color:var(--muted); margin-bottom:22px; }
  #list { display:flex; flex-direction:column; gap:12px; }
  a.card { display:flex; align-items:center; gap:14px; background:var(--panel); border-radius:12px; padding:16px 18px;
           color:inherit; text-decoration:none; border-left:6px solid #888; transition:background .15s, transform .15s; }
  a.card:hover { background:#1f3042; transform:translateX(3px); }
  a.card.online { border-left-color:var(--up); }
  a.card.offline { border-left-color:var(--down); opacity:.65; }
  .info { flex:1; min-width:0; }
  .name { font-size:1.15rem; font-weight:700; }
  .desc { color:var(--muted); font-size:.9rem; margin-top:2px; }
  .badge { display:flex; align-items:center; gap:7px; font-size:.85rem; white-space:nowrap; color:var(--muted); }
  .dot { width:11px; height:11px; border-radius:50%; background:#667; }
  .online .dot { background:var(--up); box-shadow:0 0 8px var(--up); }
  .offline .dot { background:var(--down); }
  #empty, #err { color:var(--muted); }
  #err { color:#f39c12; margin-top:14px; min-height:1.2em; font-size:.85rem; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🎮 Games</h1>
  <div class="sub">Pick a game</div>
  <div id="list"></div>
  <div id="err"></div>
</div>

<script>
  const list = document.getElementById("list"), err = document.getElementById("err");

  function render(games) {
    list.textContent = "";
    if (!games.length) { const e = document.createElement("div"); e.id = "empty"; e.textContent = "No games yet."; list.append(e); return; }
    games.forEach(g => {
      const a = document.createElement("a");
      a.className = "card " + (g.online === true ? "online" : g.online === false ? "offline" : "");
      a.href = g.link;

      const info = document.createElement("div"); info.className = "info";
      const n = document.createElement("div"); n.className = "name"; n.textContent = g.name;
      info.append(n);
      if (g.description) { const d = document.createElement("div"); d.className = "desc"; d.textContent = g.description; info.append(d); }

      const b = document.createElement("div"); b.className = "badge";
      const dot = document.createElement("span"); dot.className = "dot";
      const t = document.createElement("span");
      t.textContent = g.online === true ? "Online" : g.online === false ? "Offline" : "Unknown";
      b.append(dot, t);

      a.append(info, b);
      list.append(a);
    });
  }

  async function refresh() {
    try {
      const r = await fetch("api/games", { cache: "no-store" });
      if (!r.ok) throw new Error("HTTP " + r.status);
      render((await r.json()).games);
      err.textContent = "";
    } catch (e) { err.textContent = "⚠ Server unreachable (showing last data)"; }
  }
  refresh();
  setInterval(refresh, 10000);
</script>
</body>
</html>
